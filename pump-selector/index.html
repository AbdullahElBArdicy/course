<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P-ZONE Pump Selector</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:Arial;background:#f2f6fb;margin:0;color:#142033}.w{max-width:1400px;margin:auto;padding:24px}.c{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0001}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}input,select,button{padding:12px;border:1px solid #ccd7e3;border-radius:10px;font-size:15px;width:100%;box-sizing:border-box}button{background:#123c69;color:#fff;border:0;font-weight:bold}.s{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.st{border:1px solid #dbe5ef;border-radius:12px;padding:12px}.st b{font-size:22px;display:block}.tw{overflow:auto;max-height:600px}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{padding:10px;border-bottom:1px solid #e4ebf2;text-align:right;font-size:13px}th{position:sticky;top:0;background:#edf4fa}.ok{color:#087a55;font-weight:bold}.bad{color:#b54708;font-weight:bold}.m{color:#68778b}.charts{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.cb{height:430px}.rank{border-right:5px solid #087a55;background:#f2fbf7;padding:11px;margin:8px 0;border-radius:10px}@media(max-width:850px){.g,.s,.charts{grid-template-columns:1fr 1fr}}@media(max-width:550px){.g,.s,.charts{grid-template-columns:1fr}}</style></head><body><div class="w"><h1>P-ZONE Pump Selection Tool</h1><p class="m">يعرض Head لكل مضخة عند الـ Flow المطلوب ولا يخفي المضخات التي لا تحقق الـ Head.</p><div class="c g"><input id="q" type="number" step=".01" value="33.18" placeholder="Flow Q m3/h"><input id="h" type="number" step=".01" value="15" placeholder="Required Head m"><select id="app"><option value="all">كل التطبيقات</option><option value="pool">Pool Filtration</option><option value="sump">Submersible / Sump</option><option value="sewage">Dirty Water / Sewage</option></select><select id="water"><option value="all">كل أنواع المياه</option><option value="fresh">Fresh</option><option value="saline">Saline</option></select><button onclick="render()">احسب لكل المضخات</button></div><div id="sum"></div><div class="c"><h3>كل المضخات</h3><div class="tw"><table><thead><tr><th>#</th><th>الشركة</th><th>الموديل</th><th>القدرة</th><th>المادة</th><th>Q Range</th><th>Head @ Q</th><th>مقارنة بالمطلوب</th><th>Code</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="charts"><div class="c"><h3>Performance Curves + Duty Point</h3><div class="cb"><canvas id="ch"></canvas></div></div><div class="c"><h3>الأقرب للـ Duty Point</h3><div id="rank"></div><p class="m">الترتيب حسب فرق الـHead فقط، وليس تقييم BEP أو efficiency.</p></div></div></div><script>
const P=[
['AstralPool','Victoria Plus Silent 0.5 HP','pool','Thermoplastic',1,'0.5 HP','65557/65558',[[0,14],[4,13.2],[8,11.2],[11,8],[14,3]]],
['AstralPool','Victoria Plus Silent 0.75 HP','pool','Thermoplastic',1,'0.75 HP','65560/65561',[[0,15],[5,14],[11,10],[16,5],[18,2]]],
['AstralPool','Victoria Plus Silent 1 HP','pool','Thermoplastic',1,'1 HP','65562/65563',[[0,17],[6,15.5],[12,12],[16,10],[23,3]]],
['AstralPool','Victoria Plus Silent 1.5 HP','pool','Thermoplastic',1,'1.5 HP','65564/65565',[[0,18],[8,17],[16,14],[22.5,10],[29,3]]],
['AstralPool','Victoria Plus Silent 2 HP','pool','Thermoplastic',1,'2 HP','65566/65567',[[0,18],[10,17],[20,14],[26.5,10],[33.5,3]]],
['AstralPool','Victoria Plus Silent 3 HP','pool','Thermoplastic',1,'3 HP','65569/65570',[[0,21],[12,20],[24,16],[34,10],[41,3]]],
['EBARA','BEST 2','sump','AISI 304',0,'0.55 kW / 0.75 HP','BEST 2M/BEST 2',[[0,13.1],[1.2,12.2],[2.4,11.4],[4.8,9.8],[7.2,8.3],[9.6,6.7],[10.2,6.3],[12,5],[15.6,2.9]]],
['EBARA','BEST 3','sump','AISI 304',0,'0.75 kW / 1 HP','BEST 3M/BEST 3',[[0,14.6],[1.2,13.6],[2.4,12.7],[4.8,11.1],[7.2,9.5],[9.6,7.9],[10.2,7.6],[12,6.4],[15.6,4],[16.8,3.2]]],
['EBARA','BEST 4','sump','AISI 304',0,'1.1 kW / 1.5 HP','BEST 4M/BEST 4',[[0,18],[1.2,17.4],[2.4,16.6],[4.8,15],[7.2,13.4],[9.6,11.7],[10.2,11.3],[12,10],[15.6,7.5],[16.8,6.7],[18,5.9],[19.8,4.6]]],
['EBARA','BEST 5','sump','AISI 304',0,'1.5 kW / 2 HP','BEST 5',[[0,19],[1.2,18.4],[2.4,17.7],[4.8,16.1],[7.2,14.5],[9.6,12.8],[10.2,12.5],[12,11.4],[15.6,9],[16.8,8],[18,7.4],[19.8,6],[21.6,5]]],
['EBARA','DW 75','sewage','AISI 304',0,'0.55 kW','DW 75 M/DW 75',[[6,8],[12,6.3],[18,4.8],[24,3.4],[30,2.2]]],
['EBARA','DW 100','sewage','AISI 304',0,'0.75 kW','DW 100 M/DW 100',[[6,10.6],[12,8.7],[18,7.1],[24,5.5],[30,4],[36,2.6]]],
['EBARA','DW 150','sewage','AISI 304',0,'1.1 kW','DW 150 M/DW 150',[[6,13.1],[12,11.3],[18,9.5],[24,7.7],[30,5.9],[36,4.2],[42,2.4]]],
['EBARA','DW 200','sewage','AISI 304',0,'1.5 kW','DW 200',[[6,16.6],[12,15],[18,13.3],[24,11.4],[30,9.5],[36,7.5],[42,5.4],[48,3.3],[54,.5]]],
['EBARA','DW 300','sewage','AISI 304',0,'2.2 kW','DW 300',[[6,20],[12,18.3],[18,16.6],[24,15.1],[30,13.3],[36,11.3],[42,9.3],[48,7.2]]],
['EBARA','DW VOX 75','sewage','AISI 304',0,'0.55 kW','DW VOX 75',[[6,6.3],[12,5],[18,3.5],[24,1.6]]],
['EBARA','DW VOX 100','sewage','AISI 304',0,'0.75 kW','DW VOX 100',[[6,7.9],[12,6.7],[18,5.3],[24,3.7],[30,1.9]]],
['EBARA','DW VOX 150','sewage','AISI 304',0,'1.1 kW','DW VOX 150',[[6,10.2],[12,9],[18,7.6],[24,6.1],[30,4.1],[36,2.1]]],
['EBARA','DW VOX 200','sewage','AISI 304',0,'1.5 kW','DW VOX 200',[[6,12.5],[12,11.2],[18,9.8],[24,8.3],[30,6.4],[36,4.2],[42,1.6]]],
['EBARA','DW VOX 300','sewage','AISI 304',0,'2.2 kW','DW VOX 300',[[6,15.7],[12,14.7],[18,13.9],[24,12.6],[30,10.7],[36,8.4],[42,6.1],[48,3.6]]]
].map(x=>({maker:x[0],name:x[1],app:x[2],mat:x[3],saline:x[4],power:x[5],code:x[6],pts:x[7]}));
function H(p,q){let a=p.pts;if(q<a[0][0]||q>a[a.length-1][0])return null;for(let i=0;i<a.length-1;i++){let A=a[i],B=a[i+1];if(q>=A[0]&&q<=B[0])return A[1]+(B[1]-A[1])*(q-A[0])/(B[0]-A[0])}return null}
let chart;function render(){let q=+document.getElementById('q').value,rh=+document.getElementById('h').value,ap=document.getElementById('app').value,w=document.getElementById('water').value;let L=P.filter(p=>(ap==='all'||p.app===ap)&&(w!=='saline'||p.saline)).map(p=>({...p,ha:H(p,q)}));let V=L.filter(p=>p.ha!=null).map(p=>({...p,d:p.ha-rh,a:Math.abs(p.ha-rh)})).sort((a,b)=>a.a-b.a);document.getElementById('sum').innerHTML='<div class="c s"><div class="st">المضخات المعروضة<b>'+L.length+'</b></div><div class="st">لها قيمة H عند Q<b>'+V.length+'</b></div><div class="st">تحقق H المطلوب أو أعلى<b>'+V.filter(p=>p.ha>=rh).length+'</b></div><div class="st">أقرب Head<b>'+(V.length?V[0].ha.toFixed(2)+' m':'—')+'</b></div></div>';document.getElementById('rows').innerHTML=L.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+p.maker+'</td><td><b>'+p.name+'</b></td><td>'+p.power+'</td><td>'+p.mat+'</td><td>'+p.pts[0][0]+'–'+p.pts[p.pts.length-1][0]+'</td><td>'+(p.ha==null?'<span class="bad">خارج نطاق الكيرف</span>':'<b>'+p.ha.toFixed(2)+' m</b>')+'</td><td>'+(p.ha==null?'<span class="m">لا extrapolation</span>':p.ha>=rh?'<span class="ok">+'+(p.ha-rh).toFixed(2)+' m</span>':'<span class="bad">'+(p.ha-rh).toFixed(2)+' m</span>')+'</td><td>'+p.code+'</td></tr>').join('');document.getElementById('rank').innerHTML=V.slice(0,6).map((p,i)=>'<div class="rank"><b>'+(i+1)+'. '+p.name+'</b><br>H @ '+q+' = '+p.ha.toFixed(2)+' m | ΔH '+p.d.toFixed(2)+' m</div>').join('')||'<span class="bad">Q خارج نطاق الكيرفات المعروضة.</span>';let ds=L.map(p=>({label:p.name,data:p.pts.map(x=>({x:x[0],y:x[1]})),borderWidth:1.5,pointRadius:1,tension:.18}));ds.push({label:'Duty Point',data:[{x:q,y:rh}],type:'scatter',pointRadius:7,backgroundColor:'#111'});if(chart)chart.destroy();chart=new Chart(document.getElementById('ch'),{type:'line',data:{datasets:ds},options:{maintainAspectRatio:false,parsing:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:9}}}},scales:{x:{type:'linear',title:{display:true,text:'Flow Q (m³/h)'}},y:{beginAtZero:true,title:{display:true,text:'Head H (m)'}}}}})}render();</script></body></html>
